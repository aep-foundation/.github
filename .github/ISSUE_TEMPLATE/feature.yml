name: Feature proposal
description: Propose a protocol, SDK, tooling, or documentation improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Protocol and wire-format proposals belong in `aep-specs`. Implementation-specific proposals belong in `aep-node`.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or interoperability problem without assuming a particular solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, public interface, or protocol change you propose.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Show concrete Service, Agent, schema, or SDK usage examples where applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility
      description: Explain relevant alternatives, compatibility risks, and effects on other AEP implementations.
