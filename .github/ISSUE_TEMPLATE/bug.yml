name: Bug report
description: Report reproducible behavior that does not match the documented contract.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use the repository that owns the affected specification or SDK. Do not report security vulnerabilities here; follow the repository's `SECURITY.md` instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and why it is incorrect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest complete example, request, document, or command that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the expected result and cite the applicable specification or documentation when possible.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the package version, language/runtime version, operating system, and relevant framework or transport.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized logs, traces, screenshots, or related issues. Never include credentials or private data.
